name: Fast ASX opportunity monitor

on:
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC. These run every 30 minutes during the core ASX
    # session in AEST. During AEDT they shift one hour later; the broad
    # scanner remains the source of truth for universe discovery.
    - cron: "0,30 0-5 * * 1-5"

permissions:
  contents: write

concurrency:
  group: asx-fast-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/fast-opportunity-monitor

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Monitor active and near-signal securities
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: python scripts/monitor.py

      - name: Commit monitor state
        run: |
          git config user.name "ASX Opportunity Bot"
          git config user.email "actions@github.com"
          git add data/state.json data/monitor.json
          git diff --cached --quiet || git commit -m "Refresh fast ASX monitor"
          git pull --rebase
          git push origin HEAD:agent/fast-opportunity-monitor
