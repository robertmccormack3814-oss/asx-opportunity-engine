name: Fast ASX opportunity monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "0,30 10-15 * * 1-5"
      timezone: "Australia/Sydney"

permissions:
  contents: write

concurrency:
  group: asx-fast-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Monitor active and near-signal securities
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: python scripts/monitor.py

      - name: Commit monitor state
        run: |
          git config user.name "ASX Opportunity Bot"
          git config user.email "actions@github.com"
          git add data/state.json data/monitor.json data/scanner.json
          git diff --cached --quiet || git commit -m "Refresh fast ASX monitor"
          git pull --rebase
          git push
